defaults:
  - keypoints@keypoints

name: co3d
class_name: CO3D

modalities:
    - 'size'
    - 'category'
    - 'cam_intr4x4'
    - 'cam_tform4x4_obj'
    - 'rays_center3d'
    - 'mask'
    - 'category'
    - 'rgb'
    - 'mesh'
    #- 'mask'
    #- 'sequence_name'
    #- 'sequence'
    # - 'mesh'

mesh_name: 'alpha500' # 'convex500', 'voxel500' 'poisson500', 'alpha500'
pcl_source: 'droid_slam_clean'

mesh_feats_type: 'M_dinov2_frozen_base_T_centerzoom512_R_acc' # 'R_acc' # 'R_avg', 'R_avg_norm'
dist_verts_mesh_feats_reduce_type: 'min' # 'avg', 'min'

frames_count_max_per_sequence:
block_negative_depth: False

path_raw: ${platform.path_datasets}/CO3D
path_preprocess: ${platform.path_datasets}/CO3D_Preprocess

setup:
  enabled: False
  override: False
  remove_previous: False

extract_meta:
  enabled: False
  override: False
  remove_previous: False

preprocess:
  sfm:
    enabled: True
    override: False
  mask:
    enabled: True
    override: False
  pcl:
    enabled: True
    override: False
  tform_obj:
    enabled: True
    override: False
  mesh:
    enabled: True
    override: False
  mesh_feats:
    enabled: True
    override: False
  mesh_feats_dist:
    enabled: True
    override: False

dict_nested_frames:
  microwave:
