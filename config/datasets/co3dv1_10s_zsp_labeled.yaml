defaults:
  - co3dv1_10s_zsp_unlabeled

name: co3dv1_10s_zsp_labeled

sequences_require_good_cam_movement: False
sequences_require_no_missing_frames: False
preprocess:
  label:
    enabled: False
    override: False
  droid_slam:
    enabled: False
    override: False
  pcl:
    enabled: False
    override: False
    remove_previous: False
  mesh:
    enabled: False
    override: False

cuboid_source: 'default' #  'default', 'aligned', 'zsp_ref_cuboid', 'labeled'
cam_tform_obj_source: 'zsp_labeled' # 'droid_slam_zsp_labeled' 'droid_slam_labeled' 'droid_slam_aligned' 'droid_slam'
mesh_name: 'alpha500' # 'convex500', 'voxel500' 'poisson500', 'alpha500'
pcl_source: 'co3d_clean'

