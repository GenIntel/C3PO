defaults:
  - pascal3d

modalities:
    - 'rgb'
    - 'category'
    - 'mask'
    - 'kpts'
    - 'cam_intr4x4'
    - 'cam_tform4x4_obj'
    - 'size'
    - 'bbox'
    #- 'mesh'

name: ood_cv
class_name: OOD_CV

path_raw: ${platform.path_datasets}/OOD_CV
path_preprocess: ${platform.path_datasets}/OOD_CV_Preprocess

url_pascal3d_occ_script: https://raw.githubusercontent.com/Angtian/OccludedPASCAL3D/master/download_FG.sh

rpath_pascal3d_raw: PASCAL3D+_release1.1
path_pascal3d_raw: ${platform.path_datasets}/${.rpath_pascal3d_raw}


#root_path: data/OOD_CV_NeMo


#pad_texture: false
#single_mesh: true
#training_only: false
#evaluation_only: false
#augment_by_dist: false
#prepare_mode: first
#center_and_resize: true
#skip_3d_anno: false

image_sizes:
    aeroplane: [320, 672]
    bicycle: [608, 608]
    boat: [384, 672]
    bus: [320, 736]
    chair: [608, 384]
    car: [256, 672]
    diningtable: [384, 800]
    motorbike: [512, 512]
    sofa: [352, 736]
    train: [256, 608]

nuisances:
    - context
    - pose
    - shape
    - texture
    - weather

occ_level: 0
enable_cache: true
weighted: true
remove_no_bg: 8
transforms:
    - class_name: nemo.datasets.transforms.ToTensor

sampler: None
