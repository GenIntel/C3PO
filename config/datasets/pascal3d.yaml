name: pascal3d
class_name: Pascal3D

url_pascal3d_raw: ftp://cs.stanford.edu/cs/cvgl/PASCAL3D+_release1.1.zip
rpath_pascal3d_raw: PASCAL3D+_release1.1
path_pascal3d_raw: ${platform.path_datasets}/${.rpath_pascal3d_raw}

rpath_pascal3d_preproc: PASCAL3D_PreProc
path_pascal3d_preproc: ${platform.path_datasets}/${.rpath_pascal3d_preproc}

rpath_dtd_raw: DTD
path_dtd_raw: ${platform.path_datasets}/${.rpath_dtd_raw}

rpath_meshes: ${.rpath_pascal3d_preproc}/CAD_single
path_meshes: ${platform.path_datasets}/${.rpath_meshes}

url_pascal3d_seg: https://docs.google.com/uc?export=download&id=1hx6eErHtuR7TCGlQMyl2_03gXDTQw3Qm
rpath_pascal3d_seg: PASCAL3D_Seg
path_pascal3d_seg: ${platform.path_datasets}/${.rpath_pascal3d_seg}

pad_texture: false
training_only: false
evaluation_only: false
augment_by_dist: false
prepare_mode: first
center_and_resize: true
skip_3d_anno: false

occ_level: 0
occ_levels:
    train: [0]
    val: [0, 1, 2, 3]

image_sizes:
    aeroplane: [320, 672]
    bicycle: [608, 608]
    boat: [384, 672]
    bottle: [480, 800]
    bus: [320, 736]
    chair: [608, 384]
    car: [256, 672]
    diningtable: [384, 800]
    motorbike: [512, 512]
    sofa: [352, 736]
    train: [256, 608]
    tvmonitor: [480, 448]

enable_cache: true
weighted: true
remove_no_bg: 8

