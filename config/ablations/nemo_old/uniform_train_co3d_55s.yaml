# @package _global_
defaults:
  - override /datasets@train_dataset: co3d_55s_train #  co3d_55s_train, pascal3d_train

ablation_name: uniform_train_co3d_55s

method:
    nemo:
        train:
            epochs: 5
            transform:
                random_center_zoom3d:
                    W: 512
                    H: 512
                    dist_min: 15.
                    dist_max: 15.
                    center3d_min:
                        - -0.
                        - -0.
                        - -0.
                    center3d_max:
                        - +0.
                        - +0.
                        - +0.
        inference:
            sample:
                method: uniform # epnp3d2d uniform
                uniform:
                    azim:
                        min: '0.'
                        max: math.pi * 2 - (math.pi * 2) / 12.
                        steps: 12

                    elev:
                        min: -math.pi / 6
                        max: math.pi / 3
                        steps: 4

                    theta:
                        min: -math.pi / 6
                        max: math.pi / 6
                        steps: 3
            optimizer:
                beta0: 0.4
                beta1: 0.6
                lr: 2e-2 # 5e-3 5e-2
                epochs: 30 # 30
        test:
            transform:
                W: 512 # 800 512
                H: 512 # 640 512
                dist: 25. # 5. (scale_normalized_to_real) * 5. (default distance used)
                center3d: [ 0., 0., 0. ] #  None
train: True
test: True