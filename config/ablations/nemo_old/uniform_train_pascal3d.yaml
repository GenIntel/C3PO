# @package _global_
defaults:
  - override /datasets@train_dataset: pascal3d_train #  co3d_50s_train # co3d_50s_train, co3d_train, pascal3d_train

ablation_name: uniform_train_pascal3d

method:
    nemo:
        train:
            epochs: 20
        transform:
          W: 800 # 800 512
          H: 640 # 640 512
          dist: 25. # 5. (scale_normalized_to_real) * 5. (default distance used)
          center3d: [ 0., 0., 0. ] #  None

        test:
          transform:
            W: 800 # 800 512
            H: 640 # 640 512
            dist: 25. # 5. (scale_normalized_to_real) * 5. (default distance used)
            center3d: [ 0., 0., 0. ] #  None
train: True
test: True