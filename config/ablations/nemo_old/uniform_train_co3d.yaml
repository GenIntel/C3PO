# @package _global_
defaults:
  - override /datasets@train_dataset: co3d_55s_train #  co3d_55s_train, pascal3d_train

ablation_name: uniform_train_co3d

method:
    nemo:
        inference:
            sample:
                method: uniform # epnp3d2d uniform
                uniform:
                    azim:
                        min: '0.'
                        max: math.pi * 2 - (math.pi * 2) / 12.
                        steps: 12

                    elev:
                        min: -math.pi / 6
                        max: math.pi / 3
                        steps: 4

                    theta:
                        min: -math.pi / 6
                        max: math.pi / 6
                        steps: 3
            optimizer:
                beta0: 0.4
                beta1: 0.6
                lr: 2e-2 # 5e-3 5e-2
                epochs: 30 # 30

train: True
test: True