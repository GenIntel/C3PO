# @package _global_
defaults:
  - /ablations/architecture/_default

ablation_name_architecture: 'backbone_resnet'

backbone:
  class_name: ResNet
  weights: 'imagenet1k_v1' # 'imagenet1k_v2' 'imagenet1k_v1' 'none'
  downsample_rate: 16 # 8, 14, 16,
  freeze: True
  layers_returned: [4, 3, 2] # always start with depest layer...