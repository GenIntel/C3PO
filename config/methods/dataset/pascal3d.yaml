# checkpoint: ${platform.path_exps}/NeMo-Classification/2022_09_26/classification_saved_model_199.pth
# checkpoint_old: ${platform.path_exps}/NeMo-Classification/classification_saved_model_199.pth

train:
    dataloader:
        num_workers: 4
        batch_size: 12
        pin_memory: True
    transform:
      random_color: True
      random_center_zoom3d:
        apply_txtr: True
        config: ${texture_dataset}
        W: 512
        H: 512
        dist_min: 25.
        dist_max: 25.
        center3d_min:
          - -0.
          - -0.
          - -0.
        center3d_max:
          - +0.
          - +0.
          - +0.

test:

    dataloader:
        num_workers: 4
        batch_size: 4
        pin_memory: True