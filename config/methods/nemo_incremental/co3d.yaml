train:
    dataloader:
        num_workers: 4
        batch_size: 12
        pin_memory: True
    transform:
      random_color: True
      random_center_zoom3d:
        apply_txtr: True
        config: ${texture_dataset}
        W: 512
        H: 512
        dist_min: 5.
        dist_max: 15.
        center3d_min:
          - -0.
          - -0.
          - -0.
        center3d_max:
          - +0.
          - +0.
          - +0.

test:
    transform:
        W: 512 # 800 512
        H: 512 # 640 512
        dist: 25. # 5. (scale_normalized_to_real) * 5. (default distance used)
        center3d: [ 0., 0., 0. ] #  None

    dataloader:
        num_workers: 4
        batch_size: 4
        pin_memory: True

