backbone:
    class_name: ResNetExt #  ResNetExt # ResNetExt DINOv2 ResNet

train:
    sequences_tform4x4_labeled_count: -1 #
    sequences_tform4x4_estimated_frames_count: 4
    sequences_tform4x4_estimated_sim_threshold: 0.6
    T: 0.07
    optimizer:
        class_name: torch.optim.Adam
        lr: 1e-4 # 0.0001
        weight_decay: 0.0001

    batch_accumulate_to_next_step: 2

    dataloader:
        num_workers: 4
        batch_size: 12
        pin_memory: True

    transform:
        W: 512
        H: 512
        dist: 15. #  None #  None #15.
        dist_min: 15.
        dist_max: 15.
        center3d_min:
            - -0.5
            - -0.5
            - -0.5
        center3d_max:
            - +0.5
            - +0.5
            - +0.5
    epochs_to_next_ckpt: 1 # 6
    epochs_to_next_val: 1 # 6
    epochs_to_next_test: 1 # 6
    epochs_to_next_forget_est_tforms4x4: 2
    epochs: 100
    val_fraction: 0.01

test:
    transform:
        W: 512 # 800 # 512
        H: 512 # 640 # 512
        dist: 15. # 15. #  None #15.
        center3d: [0., 0., 0.] #  [0., 0., 0.] #  None

    dataloader:
        num_workers: 4
        batch_size: 4
        pin_memory: True

