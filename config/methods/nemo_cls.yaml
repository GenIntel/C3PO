path_meshes: ${test_dataset.path_co3d_preprocess}/pcls
fpaths_meshes:
    car: ${..path_meshes}/106_12650_23736/cuboid_max_1000.ply

num_noise: 5
max_group: 512
down_sample_rate: 8

classes: ${test_dataset.classes}


transforms:
    - class_name: nemo.datasets.pascal3d.Normalize

training:
    batch_size: 27 # 108 #
    workers: 8
    total_epochs: 10 # 800
    log_interval: 1
    ckpt_interval: 10 # 200
    visualize_training_data: false
    remove_no_bg: 8

    random_seed: 0
    scale_iterations_per_epoch: 1.0

    separate_bank: false
    distance_thr: 48
    weight_noise: 0.005
    loss_reg_weight: 0.1
    train_accumulate: 10
    T: 0.07

    optimizer:
        class_name: torch.optim.Adam
        lr: 0.0001
        weight_decay: 0.0001

    scheduler:
        class_name: torch.optim.lr_scheduler.MultiStepLR
        milestones:
            - 400
            - 600
        gamma: 0.2

inference:
    cameras:
        class_name: pytorch3d.renderer.PerspectiveCameras
        focal_length: 3000

    raster_settings:
        class_name: pytorch3d.renderer.RasterizationSettings
        blur_radius: 0.0
        faces_per_pixel: 1
        bin_size: 0

    optimizer:
        beta0: 0.4
        beta1: 0.6
        lr: 5e-2 # 5e-2
        epochs: 30

    rasterizer:
        class_name: pytorch3d.renderer.MeshRasterizer

backbone:
    class_name: nemo.models.keypoint_representation_net.NetE2E
    net_type: resnetext
    local_size:
        - 1
        - 1
    noise_on_mask: false
    output_dimension: 128
    reduce_function: None
    pretrain: true
    # n_noise_points: 5 # duplicate of num_noise?

memory_bank:
    class_name: nemo.models.feature_banks_cls.NearestMemoryManager
    input_size: 128
    K: 1
    momentum: 0.96
