defaults:
  - optimizer@train.optimizer: adam
  - scheduler@train.scheduler: multistep

name: nemo
class_name: NeMo

num_noise: 5
max_group: 512
down_sample_rate: 8

classes: ${train_datasets.labeled.categories}

transforms:
    - class_name: nemo.datasets.pascal3d.Normalize

model:
  backbone:
    class_name: ResNet
    weights: 'imagenet1k_v1' # 'imagenet1k_v2' 'imagenet1k_v1' 'none'
    freeze: False
    layers_returned: [4, 3, 2] # always start with depest layer...
  head:
    class_name: ResNet
    block_type: 'bottleneck' # 'bottleneck', 'basic'
    conv_blocks:
      out_dims: [128]
      strides: [1]
    fully_connected:
      out_dim: # None means that there is no linear layer
    normalize: True

train:
  val: True
  split: random # 'random' 'sequences_separated' 'seqences_shared'

  transform:
    random_color: True
    random_center_zoom3d:
      apply_txtr: False
      config: ${texture_dataset}
      W: 512
      H: 512
      dist: #  None #  None #15.
      dist_min:
      dist_max:
      center3d_min:
        - -0.5
        - -0.5
        - -0.5
      center3d_max:
        - +0.5
        - +0.5
        - +0.5
  epochs_to_next_test: 1
  epochs: 20
  val_fraction: 0.01
  batch_accumulate_to_next_step: 2
  T: 0.07

  visualize:
      down_sample_rate: 4.
      count_best: 3
      count_worst: 3
      count_rand: 1
      modalities:
        - 'gt_verts_ncds_in_rgb'
      samples_scores: True
      samples_sorted: True
      live: False


test:
    transform:
        W: 512
        H: 512
        dist: # 14.
        center3d: [ 0., 0., 0. ] #

    dataloader:
        num_workers: 0
        batch_size: 1
        pin_memory: True

    visualize:
      down_sample_rate: 4.
      count_best: 3
      count_worst: 3
      count_rand: 1
      modalities:
        - 'pred_vs_gt_verts_ncds_in_rgb'
        - 'net_feats_nearest_verts'
        - 'sim_pxl'
        - 'samples'
      samples_scores: True
      samples_sorted: True
      live: False

inference:
    live: False
    sample:
      method: uniform # epnp3d2d uniform
      epnp3d2d:
        count_cams: 100
        count_pts: 4
      uniform:
        azim:
            min: '0.'
            max: math.pi * 2 - (math.pi * 2) / 12.
            steps: 12

        elev:
            min: -math.pi / 6
            max: math.pi / 3
            steps: 4

        theta:
            min: -math.pi / 6
            max: math.pi / 6
            steps: 3
    pose_iterative_refine: True
    optimizer:
        beta0: 0.4
        beta1: 0.6
        lr: 2e-2 # 5e-3 5e-2
        epochs: 30 # 30



