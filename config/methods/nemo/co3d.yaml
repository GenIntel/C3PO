# path_meshes: ${test_dataset.path_co3d_preprocess}/cuboids
fpaths_meshes: ${test_dataset.fpaths_cuboids}

    #car: ${..path_meshes}/106_12650_23736/cuboid_max_1000.ply

# checkpoint: /scratch/sommerl/exps/06-06_14-36-03/nemo.ckpt
# checkpoint: /misc/lmbraid19/sommerl/exps/06-07_11-18-02/nemo.ckpt
# checkpoint: /scratch/sommerl/exps/06-07_13-32-55/nemo.ckpt

train:
    epochs_to_next_test: -1
    epochs: 200
    batch_accumulate_to_next_step: 2

    visualize:
        verts_ncds_in_rgb: True
        net_feats_nearest_verts: True

    val_fraction: 0.01

    dataloader:
        num_workers: 4
        batch_size: 16
        pin_memory: True

test:
    visualize:
        verts_ncds_in_rgb: True
        net_feats_nearest_verts: True

    dataloader:
        num_workers: 4
        batch_size: 4
        pin_memory: True

    azim:
        min: '0.'
        max: math.pi * 2 - (math.pi * 2) / 7.
        steps: 6
    elev:
        min: '0.'
        max: math.pi * 2 - (math.pi * 2) / 7.
        steps: 6
    theta:
        min: '0.'
        max: math.pi * 2 - (math.pi * 2) / 7.
        steps: 6
    dist:
        min: '10.'
        max: '10.'
        steps: 1

backbone:
    transform:
        width: 512
        height: 512
        distance: 16.