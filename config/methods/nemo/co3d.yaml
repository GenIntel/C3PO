# checkpoint: /misc/lmbraid19/sommerl/exps/06-15_09-11-03_CO3D_NeMo_local/nemo.ckpt

train:
    transform:
        W: 512
        H: 512
        dist: 20.
        center3d_min:
            - -0.5
            - -0.5
            - -0.5
        center3d_max:
            - +0.5
            - +0.5
            - +0.5
    epochs_to_next_ckpt: 5
    epochs_to_next_val: 5
    epochs_to_next_test: 5
    epochs: 50
    batch_accumulate_to_next_step: 2

    visualize:
        live: True
        verts_ncds_in_rgb: True
        net_feats_nearest_verts: False

    val_fraction: 0.01

    dataloader:
        num_workers: 4
        batch_size: 16
        pin_memory: True

test:
    transform:
        W: 512
        H: 512
        dist: 20.
    optimizer:
        epochs: 30

    visualize:
        live: False
        verts_ncds_in_rgb: True
        net_feats_nearest_verts: True

    dataloader:
        num_workers: 4
        batch_size: 1
        pin_memory: True

    azim:
        min: '0.'
        max: math.pi * 2 - (math.pi * 2) / 8.
        steps: 8
    elev:
        min: -math.pi / 2
        max: math.pi / 2
        steps: 5
    theta:
        min: '0.'
        max: math.pi * 2 - (math.pi * 2) / 8.
        steps: 8
    dist:
        min: '20.'
        max: '20.'
        steps: 1

