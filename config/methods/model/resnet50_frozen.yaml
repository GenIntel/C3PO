backbone:
  class_name: ResNet
  weights: 'imagenet1k_v1' # 'imagenet1k_v2' 'imagenet1k_v1' 'none'
  freeze: False
  layers_returned: [4, 3, 2] # always start with depest layer...
head:
  class_name: ResNet
  block_type: 'bottleneck' # 'bottleneck', 'basic'
  conv_blocks:
    out_dims: [128]
    strides: [1]
    pre_upsampling: [1.]
  fully_connected:
    out_dim: # None means that there is no linear layer
  normalize: True

