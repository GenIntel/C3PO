defaults:
  - optimizer@train.optimizer: adam
  - scheduler@train.scheduler: multistep

name: regression
class_name: Regression

model:
  backbone:
    class_name: ResNet
    layers_returned: [4, 3, 2] # always start with depest layer...
  head:
    class_name: ResNet
    conv_blocks:
      out_dims: [2048]
      strides: [1]
    fully_connected:
      out_dim: 3 # None means that there is no linear layer
    normalize: False

train:

  dataloader:
    num_workers: 4
    batch_size: 12
    pin_memory: True

  val: True
  transform:
    random_color: True
    random_center_zoom3d:
      W: 512
      H: 512
      dist: #  None #  None #15.
      dist_min:
      dist_max:
      center3d_min:
        - -0.5
        - -0.5
        - -0.5
      center3d_max:
        - +0.5
        - +0.5
        - +0.5
  epochs_to_next_test: 1
  epochs: 40
  val_fraction: 0.01
  batch_accumulate_to_next_step: 2
  T: 0.07

test:
    transform:
        W: 512
        H: 512
        dist: # 14.
        center3d: #

    dataloader:
        num_workers: 4
        batch_size: 4
        pin_memory: True

    visualize:
      count_best: 3
      count_worst: 3
      count_rand: 1
      modalities:
        - 'verts_ncds_in_rgb'
        - 'net_feats_nearest_verts'
        - 'sim_pxl'
        - 'samples'
      samples_scores: True
      samples_sorted: True
      live: False


inference:
    live: False